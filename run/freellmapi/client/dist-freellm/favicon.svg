<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- MedQ AI Router mark: the brand dot inside a broken routing ring.
       The gap in the ring is the "fallback" — traffic re-routes around it.
       Teal ring matches the MedQ app accent (#00e5a0). -->
  <rect width="64" height="64" rx="14" fill="#09090b"/>
  <circle cx="32" cy="32" r="9.5" fill="#00e5a0"/>
  <circle cx="32" cy="32" r="18" fill="none" stroke="#00e5a0" stroke-opacity=".55"
          stroke-width="3.5" stroke-linecap="round" stroke-dasharray="86 27"
          transform="rotate(-60 32 32)"/>
</svg>
